name: Publish NuGet

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify-version-sync

  build-native:
    name: Build native (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            rid: win-x64
            lib_name: m3l_cabi.dll
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rid: linux-x64
            lib_name: libm3l_cabi.so
          - target: x86_64-apple-darwin
            runner: macos-latest
            rid: osx-x64
            lib_name: libm3l_cabi.dylib
          - target: aarch64-apple-darwin
            runner: macos-latest
            rid: osx-arm64
            lib_name: libm3l_cabi.dylib
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build m3l-cabi
        run: cargo build -p m3l-cabi --release --target ${{ matrix.target }}

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib_name }}
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Arrange runtimes directory
        run: |
          cd bindings/csharp
          mkdir -p runtimes/win-x64/native
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/osx-x64/native
          mkdir -p runtimes/osx-arm64/native
          cp ../../artifacts/native-win-x64/m3l_cabi.dll       runtimes/win-x64/native/
          cp ../../artifacts/native-linux-x64/libm3l_cabi.so   runtimes/linux-x64/native/
          cp ../../artifacts/native-osx-x64/libm3l_cabi.dylib  runtimes/osx-x64/native/
          cp ../../artifacts/native-osx-arm64/libm3l_cabi.dylib runtimes/osx-arm64/native/

      - name: List runtimes
        run: find bindings/csharp/runtimes -type f

      - name: Read version from VERSION file
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet
        run: |
          cd bindings/csharp
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -o ./nupkg

      # The push itself runs in the organization's central publish workflow, which holds the
      # only NuGet trust policy; this repository holds no NuGet credential. Only the packed
      # files go up, and they are kept for one day.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            bindings/csharp/nupkg/*.nupkg
            bindings/csharp/nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: pack
    uses: iyulab/nuget-publish/.github/workflows/request.yml@de1e58c8bcefaf88f497fcb58899a1c6e84f4e29 # main
    permissions: {}
    secrets: inherit
