name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'spec/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Every manifest the version-sync job checks, so drift fails on the commit that
      # introduces it rather than on the next release (crates/** already covers NAPI's).
      - 'VERSION'
      - 'bindings/csharp/M3L.Native.csproj'
      - 'bindings/typescript/package.json'
      - 'update-version.ps1'
      - '.github/actions/verify-version-sync/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'spec/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # Every manifest the version-sync job checks, so drift fails on the commit that
      # introduces it rather than on the next release (crates/** already covers NAPI's).
      - 'VERSION'
      - 'bindings/csharp/M3L.Native.csproj'
      - 'bindings/typescript/package.json'
      - 'update-version.ps1'
      - '.github/actions/verify-version-sync/**'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same gate the four publish workflows run first. Here it runs on every change
      # to a manifest, so a drifted tree is caught before a release is attempted from it.
      - uses: ./.github/actions/verify-version-sync

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --exclude m3l-wasm --exclude m3l-napi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --exclude m3l-wasm --exclude m3l-napi -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --exclude m3l-wasm --exclude m3l-napi
      - name: Test
        run: cargo test --workspace --exclude m3l-wasm --exclude m3l-napi
